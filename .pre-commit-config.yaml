repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/nf-core/.*|
              subworkflows/nf-core/.*|
              .*\.snap$ |
              assets/dataset/EGP017_25_B2_336/best_assembly_info_and_QC/busco_specific_pypolca/EGP017_25_B2_336_best_assembly_full_table\.tsv
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/nf-core/.*|
              subworkflows/nf-core/.*|
              .*\.snap$ |
              assets/dataset/EGP017_25_B2_336/best_assembly_info_and_QC/busco_specific_pypolca/EGP017_25_B2_336_best_assembly_full_table\.tsv
          )$
